<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI Controls Checklist</title>
<script>
  // Apply the saved theme before first paint; light unless this browser chose dark.
  try { document.documentElement.setAttribute('data-theme', (JSON.parse(localStorage.getItem('agentic-ai-checklist-ui') || '{}').theme) === 'dark' ? 'dark' : 'light'); }
  catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Light is the default (set on <html> before paint); dark is opt-in with the header toggle. */
  :root {
    --ink: #10243a; --ink-text: #ffffff; --ink-muted: #b9c6d6; --ink-line: #2c4560;
    --page: #e8ecf1; --surface: #ffffff; --surface-2: #f4f6f9; --band: #e2e8f0; --line: #c3ccd7; --line-soft: #dde3ea;
    --text: #111d29; --muted: #4a5868; --accent: #1f4fb5; --accent-soft: #e6edfb; --accent-text: #ffffff;
    --l0: #b42318; --l1: #b54708; --l2: #067647; --level-text: #ffffff;
    --l0-soft: #fdeceb; --l1-soft: #fdf1e2; --l2-soft: #e4f4ec; --na-soft: #eef1f5;
    --na: #6b7a89; --mark: #fff1a8; --focus: #f5a524;
    --shadow: 0 1px 2px rgba(16, 36, 58, .07), 0 2px 8px rgba(16, 36, 58, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #0b1622; --ink-line: #23384d;
      --page: #0f1720; --surface: #17212c; --surface-2: #1d2935; --band: #243241; --line: #3a4858; --line-soft: #29353f;
      --text: #e6ebf1; --muted: #a3b0be; --accent: #7da2f0; --accent-soft: #1f2e4a; --accent-text: #0b1622;
      --l0: #c2362f; --l1: #b85a0a; --l2: #12805c; --na: #8795a3; --mark: #5c4d12;
      --l0-soft: #3a1f1e; --l1-soft: #382915; --l2-soft: #14322a; --na-soft: #1d2935; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --ink: #0b1622; --ink-line: #23384d;
    --page: #0f1720; --surface: #17212c; --surface-2: #1d2935; --band: #243241; --line: #3a4858; --line-soft: #29353f;
    --text: #e6ebf1; --muted: #a3b0be; --accent: #7da2f0; --accent-soft: #1f2e4a; --accent-text: #0b1622;
    --l0: #c2362f; --l1: #b85a0a; --l2: #12805c; --na: #8795a3; --mark: #5c4d12;
    --l0-soft: #3a1f1e; --l1-soft: #382915; --l2-soft: #14322a; --na-soft: #1d2935; --shadow: none;
  }
  * { box-sizing: border-box; }
  /* --fh is the sticky filter bar's height, kept current by a ResizeObserver. */
  html { scroll-padding-top: calc(var(--fh, 110px) + 16px); }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header.top { background: var(--ink); color: var(--ink-text); }
  header.top .wrap { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; padding-top: 22px; padding-bottom: 20px; }
  header.top h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
  header.top .sub { color: var(--ink-muted); margin-top: 4px; font-size: 14px; }
  .assess { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .assess label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-muted); }
  .assess input, .assess select { background: #ffffff; color: #14212e; border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; min-width: 200px; }
  .btn-ghost { background: transparent; color: var(--ink-text); border: 1px solid var(--ink-line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--ink-muted); }

  /* Filter bar */
  .filters { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .filters .wrap { padding-top: 8px; padding-bottom: 10px; }
  .frow { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .frow + .frow { margin-top: 8px; }
  /* Settings row: a tinted strip so the assessment's settings read apart from the list filters. */
  .setrow { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 8px; }
  .clsfield { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; }
  .frow select.field { max-width: 210px; }
  .clsfield .seg button { font-weight: 400; }
  .clsfield .seg button[aria-pressed="true"] { font-weight: 600; }
  .field, .btn, .menu > summary { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .btn, .menu > summary { cursor: pointer; }
  .btn:hover, .menu > summary:hover { border-color: var(--accent); }
  input[type=search].field { flex: 1 1 220px; min-width: 200px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .lvl-toggle { display: inline-flex; gap: 6px; }
  .lvl-toggle button { border: 2px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 9px 4px 5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .lvl-toggle button[aria-pressed="true"].L0 { border-color: var(--l0); }
  .lvl-toggle button[aria-pressed="true"].L1 { border-color: var(--l1); }
  .lvl-toggle button[aria-pressed="true"].L2 { border-color: var(--l2); }
  .lvl-toggle button[aria-pressed="false"] { opacity: .55; }
  .menu { position: relative; }
  .menu > summary { list-style: none; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu > summary.active { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 540px; max-width: 92vw; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 12px 28px rgba(16, 36, 58, .22); }
  .panel p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .panel h4 { margin: 12px 0 6px; font-size: 13.5px; font-weight: 600; }
  .panel h4:first-of-type { margin-top: 0; }
  /* Wide panels hang from the filter bar, not their button, so they never run off screen. */
  .filters .wrap { position: relative; }
  .menu.wide-menu { position: static; }
  .panel.wide { left: 24px; right: 24px; width: auto; max-width: 880px; max-height: 72vh; overflow-y: auto; }
  .panel .row { margin-top: 12px; display: flex; gap: 8px; }
  .qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
  .qrow b { font-weight: 600; }
  .seg.small button { padding: 3px 9px; font-size: 13px; }
  /* "Not sure" is the unanswered default, so it is tinted rather than filled like a real answer. */
  .seg button[data-a=""][aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .assumed { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 6px; }
  .preset { text-align: left; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .preset b { display: block; font-size: 14px; color: var(--text); margin-bottom: 2px; }
  .preset:hover { border-color: var(--accent); }
  .preset[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); padding: 7px 9px; }
  .lrow { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 4px 14px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line-soft); }
  .lrow .lname { font-weight: 600; font-size: 14px; }
  .lrow .lcovers { font-size: 12.5px; color: var(--muted); }
  .lrow select { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
  .lrow .fixed { font-size: 13px; color: var(--muted); }
  .lrow .lchg { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .lrow .lchg:empty { display: none; }
  /* Risk flag states: met (red), possible (amber), out = ruled out (green), unknown (grey). */
  .rflag { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--na); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; font-size: 14px; }
  .rflag.met { border-left-color: var(--l0); }
  .rflag.possible { border-left-color: var(--l1); }
  .rflag.out { border-left-color: var(--l2); }
  .rflag h3 { margin: 0 0 6px; font-size: 15.5px; }
  .rflag ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 3px; }
  .rflag li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; }
  .rflag .st { font-weight: 600; color: var(--muted); }
  .st.met { color: var(--l0); }
  .st.possible { color: var(--l1); }
  .st.out { color: var(--l2); }
  .find { display: block; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--na);
    border-radius: 8px; padding: 10px 12px; color: inherit; text-decoration: none; font-size: 13.5px; }
  .find:hover { border-color: var(--accent); }
  .find.met { border-left-color: var(--l0); } .find.possible { border-left-color: var(--l1); } .find.out { border-left-color: var(--l2); }
  .find .fhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 600; font-size: 14px; }
  .find .fstate { font-size: 13px; }
  .find ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
  .find li { display: flex; gap: 7px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.met { background: var(--l0); } .dot.possible { background: var(--l1); } .dot.out { background: var(--l2); }
  .rflag p { margin: 0 0 8px; color: var(--muted); max-width: 90ch; }
  .rflag .act { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  /* System profile, the first step, at the top of the main column. */
  details.setup { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
  details.setup > summary { cursor: pointer; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; font-size: 18px; font-weight: 600; }
  details.setup .sprog { font-size: 14px; font-weight: 400; color: var(--muted); }
  details.setup[open] > summary { margin-bottom: 8px; }
  details.setup > div > p:first-child { margin: 0 0 4px; color: var(--muted); font-size: 14px; max-width: 90ch; }
  .pgroups { columns: 2 380px; column-gap: 32px; }
  .pgroup { break-inside: avoid; padding-top: 10px; }
  .pgroup h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  details.setup .row { margin-top: 12px; display: flex; gap: 8px; }
  /* "Applies when" tags, coloured by profile category (cat1-cat6 in profile group order; cat0 = set by Sourcing).
     Square corners and a left edge keep them distinct from the round layer pills. */
  .tag.trigger { background: var(--cat-soft, var(--surface-2)); border: 1px solid var(--line-soft); border-left: 4px solid var(--cat, var(--line));
    border-radius: 3px; color: var(--cat, var(--text)); font-weight: 500; }
  .tag.trigger.hit { font-weight: 700; border-color: var(--cat, var(--accent)); }
  .tag.trigger.hit::after { content: " ✓"; }
  .cat0 { --cat: #56626f; --cat-soft: #eef1f4; }  /* Set by Sourcing */
  .cat1 { --cat: #4553c4; --cat-soft: #eceefc; }  /* Components */
  .cat2 { --cat: #17766f; --cat-soft: #e2f3f1; }  /* System design */
  .cat3 { --cat: #7f45b8; --cat-soft: #f3ecfb; }  /* Cognitive capabilities */
  .cat4 { --cat: #b23c66; --cat-soft: #fbe9f0; }  /* Interaction capabilities */
  .cat5 { --cat: #1b6f9a; --cat-soft: #e2f0f8; }  /* Operational capabilities */
  .cat6 { --cat: #7a6516; --cat-soft: #f7f1dc; }  /* Data and deployment */
  :root[data-theme="dark"] .tag.trigger { background: transparent; }
  :root[data-theme="dark"] .cat0 { --cat: #aab4bf; } :root[data-theme="dark"] .cat1 { --cat: #a3acf2; }
  :root[data-theme="dark"] .cat2 { --cat: #6fc7bd; } :root[data-theme="dark"] .cat3 { --cat: #c4a0ee; }
  :root[data-theme="dark"] .cat4 { --cat: #ee93b4; } :root[data-theme="dark"] .cat5 { --cat: #7cc0e6; }
  :root[data-theme="dark"] .cat6 { --cat: #ddc46e; }
  .pgroup[class*="cat"] h4 { border-left: 4px solid var(--cat); color: var(--cat); }
  /* Right column of a measure: level block, then a "who does it" block. */
  .mlevel { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .mowner { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding-top: 8px; border-top: 1px solid var(--line-soft); width: 100%; }
  .mcap { font-size: 12px; color: var(--muted); }
  .mowner .mcap { margin-top: 2px; margin-bottom: -2px; }
  .meta .mcap, .mlayer .mcap { font-weight: 600; }
  .mlayer { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 5px 6px; }
  .req.unset { font-style: italic; }
  /* Layer chips: one hue per layer, so ownership patterns are easy to scan. */
  .lchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--ly-soft, var(--surface-2)); color: var(--ly, var(--text)); border: 1px solid var(--ly, var(--line)); max-width: 250px; text-align: left; }
  .ly-usage       { --ly: #4b5a8a; --ly-soft: #eceff8; }
  .ly-data        { --ly: #2b7a6b; --ly-soft: #e3f3ef; }
  .ly-identity    { --ly: #8a6a12; --ly-soft: #faf2dc; }
  .ly-config      { --ly: #2f66b3; --ly-soft: #e6eefa; }
  .ly-runtime     { --ly: #7a4bb0; --ly-soft: #f1eafa; }
  .ly-monitoring  { --ly: #1f7c97; --ly-soft: #e2f2f7; }
  .ly-application { --ly: #a3456f; --ly-soft: #f9e8f0; }
  .ly-model       { --ly: #9a5a2a; --ly-soft: #f8ece2; }
  .ly-platform    { --ly: #56626f; --ly-soft: #edf0f3; }
  :root[data-theme="dark"] .lchip { background: transparent; }
  :root[data-theme="dark"] .ly-usage { --ly: #9fb0e8; } :root[data-theme="dark"] .ly-data { --ly: #78cbb8; }
  :root[data-theme="dark"] .ly-identity { --ly: #e0c06a; } :root[data-theme="dark"] .ly-config { --ly: #8fb5ef; }
  :root[data-theme="dark"] .ly-runtime { --ly: #c3a2ee; } :root[data-theme="dark"] .ly-monitoring { --ly: #78c6dc; }
  :root[data-theme="dark"] .ly-application { --ly: #e69abd; } :root[data-theme="dark"] .ly-model { --ly: #e2a676; }
  :root[data-theme="dark"] .ly-platform { --ly: #aab4bf; }
  .spacer { flex: 1; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-top: 22px; padding-bottom: 60px; }
  nav.spine { position: sticky; top: calc(var(--fh, 110px) + 12px); align-self: start;
    max-height: calc(100vh - var(--fh, 110px) - 24px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .spine ol { list-style: none; margin: 0; padding: 0; position: relative; }
  .spine ol::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 16px; width: 2px; background: var(--line); }
  .spine li { position: relative; }
  .spine li > a { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 8px 0; color: inherit; text-decoration: none; }
  .spine .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px;
    background: var(--surface); border: 2px solid var(--line); position: relative; z-index: 1; }
  .spine .done .num { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .spine .name { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .spine .count { font-size: 13px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .overall { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .overall .big { font-size: 28px; font-weight: 600; line-height: 1.1; }
  .overall .lbl { color: var(--muted); font-size: 13.5px; }
  .overall .lv { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; }
  .overall .lv .bar { margin: 0; }
  .overall .lv .bar > i.L0 { background: var(--l0); } .overall .lv .bar > i.L1 { background: var(--l1); } .overall .lv .bar > i.L2 { background: var(--l2); }

  /* About */
  details.about { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
  details.about > summary { cursor: pointer; font-weight: 600; }
  .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 12px; font-size: 14px; }
  .about-grid h3 { font-size: 15px; margin: 6px 0; }
  .about-grid p { margin: 0 0 8px; max-width: 70ch; }
  .about-grid ul { margin: 0 0 6px; padding-left: 18px; }

  /* Stage + control */
  section.stage { margin-top: 30px; }
  section.stage > h2 { display: flex; align-items: center; gap: 12px; font-size: 21px; margin: 0 0 14px; font-weight: 600;
    padding-bottom: 8px; border-bottom: 2px solid var(--line); }
  section.stage > h2 .snum { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text); font-size: 15px; }
  section.stage > h2 .count { font-size: 14px; font-weight: 400; color: var(--muted); }
  /* Control: tinted header band over white measure rows. */
  details.control { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
  details.control[open] { border-color: var(--accent); }
  details.control > summary { cursor: pointer; list-style: none; padding: 12px 16px; display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface-2); }
  details.control > summary::-webkit-details-marker { display: none; }
  details.control > summary:hover { background: var(--band); }
  details.control[open] > summary { background: var(--band); border-bottom: 1px solid var(--line); }
  .cid { font-weight: 700; color: var(--accent); font-size: 15px; }
  .ctitle { font-weight: 600; max-width: 78ch; }
  .cmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .cmeta .threat { text-decoration: underline dotted var(--line); text-underline-offset: 3px; cursor: help; }
  .cnote { font-style: italic; }
  .cside { text-align: right; min-width: 150px; }
  .cside .frac { font-size: 13px; color: var(--muted); }
  .cside .bar { width: 150px; margin-left: auto; }
  .lvcount { display: inline-flex; gap: 4px; margin-bottom: 4px; }

  /* Measures */
  ul.measures { list-style: none; margin: 0; padding: 0; }
  li.measure { display: grid; grid-template-columns: 34px minmax(0, 1fr) 290px; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line-soft); }
  li.measure:first-child { border-top: 0; }
  li.measure.is-met { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
  li.measure.is-na { opacity: .62; }
  .status { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--muted); background: var(--surface); cursor: pointer;
    display: grid; place-items: center; padding: 0; position: relative; overflow: hidden; }
  .status svg { width: 18px; height: 18px; }
  .status.met { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .status.partial { border-color: var(--accent); }
  .status.partial::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--fill, 50%); background: var(--accent-soft); }
  .status.partial span { position: relative; z-index: 1; font-size: 11px; font-weight: 700; color: var(--accent); }
  .status.na { border-style: dashed; border-color: var(--na); color: var(--na); }
  .mtext { font-weight: 600; max-width: 82ch; }
  .mid { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .mright { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; color: var(--level-text); line-height: 18px; white-space: nowrap; }
  .badge.L0 { background: var(--l0); } .badge.L1 { background: var(--l1); } .badge.L2 { background: var(--l2); }
  .req { font-size: 12.5px; color: var(--muted); text-align: right; max-width: 170px; }
  .req.mandatory { color: var(--text); font-weight: 600; }
  ul.checks { list-style: none; margin: 8px 0 2px; padding: 0; }
  ul.checks li { display: flex; gap: 9px; align-items: flex-start; padding: 3px 0; }
  ul.checks input { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--accent); flex: none; }
  ul.checks label { cursor: pointer; }
  ul.checks li.na label { text-decoration: line-through; color: var(--muted); }
  .linkbtn { background: none; border: 0; padding: 0 2px; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: none; }
  .linkbtn:hover, .linkbtn:focus-visible { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  ul.checks .linkbtn { margin-left: auto; padding-left: 10px; white-space: nowrap; visibility: hidden; }
  ul.checks li:hover .linkbtn, ul.checks li:focus-within .linkbtn, ul.checks li.na .linkbtn { visibility: visible; }
  @media (hover: none) { ul.checks .linkbtn { visibility: visible; } }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); white-space: nowrap; font-size: 12.5px; }
  .tag.hit { background: var(--accent-soft); border-color: var(--accent); }
  .ref { white-space: nowrap; }
  .evidence { margin-top: 8px; font-size: 13.5px; color: var(--muted); max-width: 82ch; background: var(--surface-2);
    border-left: 3px solid var(--line); border-radius: 0 4px 4px 0; padding: 5px 10px; }
  .evidence b { color: var(--text); font-weight: 600; }
  /* References: a lightly tinted box of inline links, quieter than the evidence line. */
  .refs { margin-top: 6px; max-width: 82ch; display: flex; flex-wrap: wrap; gap: 3px 14px; align-items: baseline;
    font-size: 12.5px; color: var(--muted); background: var(--accent-soft); border-radius: 4px; padding: 5px 10px; }
  .refs .mcap { font-weight: 600; color: var(--text); }
  .refs a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; }
  .refs a:hover { text-decoration-color: currentColor; }
  details.control > .refs { margin: 10px 16px 0 66px; max-width: none; }
  select.owner { font-size: 12.5px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--text); max-width: 250px; cursor: pointer; }
  select.owner.Vendor { background: var(--accent-soft); border-color: var(--accent); }
  select.owner.Shared { border: 1px dashed var(--accent); }
  select.owner.To-confirm { border: 1px dashed var(--muted); font-style: italic; }
  select.owner.Gap { background: var(--ink); color: #ffffff; border-color: var(--ink); font-weight: 600; }
  select.owner.unset { color: var(--muted); border-style: dashed; }
  .owner-note { font-size: 12px; color: var(--muted); }
  .overall .flags { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
  .overall .flags h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; }
  .orow { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: baseline; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 4px; padding: 3px 4px; cursor: pointer; }
  .orow b { font-size: 16px; text-align: right; }
  .orow:hover { background: var(--surface-2); }
  .orow[aria-pressed="true"] { background: var(--accent-soft); }
  .orow.zero { color: var(--muted); }
  .flags .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; border-color: var(--line); }
  .actions { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; align-items: baseline; }
  .srcs { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 10px; font-size: 11.5px; color: var(--muted); opacity: .75; }
  textarea.note { width: 100%; min-height: 64px; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface-2); resize: vertical; }
  .note-preview { margin-top: 6px; font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; white-space: pre-wrap; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .empty { padding: 48px 0; text-align: center; color: var(--muted); }
  .totop { position: fixed; right: 24px; bottom: 24px; z-index: 40; display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 8px 14px 8px 11px;
    font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 36, 58, .18); }
  .totop svg { width: 16px; height: 16px; }
  .totop:hover { background: var(--accent); color: var(--accent-text); }
  .totop[hidden] { display: none; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }

  /* Lifecycle stage colours (s1-s5, in stage order): a pastel band (--st-soft) and a stronger accent (--st)
     of the same hue. Hues avoid red, amber and green, which mean L0, L1 and L2. */
  .s1 { --st: #6a55c9; --st-soft: #efebfb; --st-band: #e4ddf8; }  /* Planning and design: lavender */
  .s2 { --st: #2f73b8; --st-soft: #e8f1fb; --st-band: #d9e8f8; }  /* Development: sky */
  .s3 { --st: #19817c; --st-soft: #e3f4f3; --st-band: #d1ecea; }  /* Deployment: aqua */
  .s4 { --st: #b0487c; --st-soft: #fbecf3; --st-band: #f6dce9; }  /* Operations and maintenance: rose */
  .s5 { --st: #5d6b7e; --st-soft: #edf0f4; --st-band: #e0e5ec; }  /* End of life: slate */
  :root[data-theme="dark"] .s1 { --st: #a594f0; --st-soft: #231f38; --st-band: #2c2647; }
  :root[data-theme="dark"] .s2 { --st: #7fb2ea; --st-soft: #1a2738; --st-band: #213247; }
  :root[data-theme="dark"] .s3 { --st: #6cc9c2; --st-soft: #162d2d; --st-band: #1c3a39; }
  :root[data-theme="dark"] .s4 { --st: #e590ba; --st-soft: #33202b; --st-band: #422936; }
  :root[data-theme="dark"] .s5 { --st: #a3b0c0; --st-soft: #1f2731; --st-band: #28323e; }
  section.stage > h2 { border-bottom-color: var(--st, var(--line)); }
  section.stage > h2 .snum { background: var(--st, var(--accent)); }
  section.stage details.control { border-left: 5px solid var(--st, var(--line)); }
  section.stage details.control > summary { background: var(--st-soft, var(--surface-2)); }
  section.stage details.control > summary:hover, section.stage details.control[open] > summary { background: var(--st-band, var(--band)); }
  section.stage details.control[open] { border-color: var(--st, var(--accent)); }
  section.stage .cid { color: var(--st, var(--accent)); }
  .spine li .num { border-color: var(--st, var(--line)); background: var(--st-soft, var(--surface)); color: var(--st, inherit); }
  .spine li.done .num { background: var(--st, var(--accent)); border-color: var(--st, var(--accent)); color: #ffffff; }
  .spine li .bar > i { background: var(--st, var(--accent)); }
  :root[data-theme="dark"] .spine li.done .num { color: #0b1622; }

  /* Hierarchy: headers sit on tinted bands, content on white, status panels tinted by state. */
  .filters { box-shadow: 0 2px 8px rgba(16, 36, 58, .08); }
  details.about { box-shadow: var(--shadow); }
  details.setup { padding: 0; overflow: hidden; box-shadow: var(--shadow); }
  details.setup > summary { padding: 12px 18px; background: var(--accent-soft); }
  details.setup[open] > summary { margin-bottom: 0; border-bottom: 1px solid var(--line); }
  #profilePanel { padding: 12px 18px 16px; }
  .pgroup h4, .panel h4, .overall .flags h4 { background: var(--band); padding: 4px 8px; border-radius: 4px; }
  .pgroup h4 + .qrow, .panel h4 + .lrow { border-top: 0; }
  .rflag, .find, .overall { box-shadow: var(--shadow); }
  .rflag.met, .find.met { background: var(--l0-soft); }
  .rflag.possible, .find.possible { background: var(--l1-soft); }
  .rflag.out, .find.out { background: var(--l2-soft); }
  .rflag.unknown, .find.unknown { background: var(--na-soft); }
  .rflag .act .btn { background: var(--surface); }
  .overall .flags { border-top-color: var(--line); }
  .btn-theme { margin-left: 4px; }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    nav.spine { position: static; }
    .spine ol { display: flex; gap: 8px; overflow-x: auto; }
    .spine ol::before { display: none; }
    .spine li > a { grid-template-columns: 28px auto; min-width: 170px; }
    .spine .num { width: 28px; height: 28px; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    li.measure { grid-template-columns: 30px minmax(0, 1fr); }
    .mright { grid-column: 2; align-items: flex-start; max-width: none; }
    .mlevel, .mowner { align-items: flex-start; }
    .mlayer { justify-content: flex-start; }
    details.control > summary { grid-template-columns: 40px minmax(0, 1fr); }
    .cside { grid-column: 2; text-align: left; } .cside .bar { margin-left: 0; }
    .assess input, .assess select { min-width: 0; width: 100%; }
    .qrow, .lrow, .presets { grid-template-columns: 1fr; }
    .panel.wide { left: 16px; right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  @media print {
    .assess .btn-ghost, details.about, .actions, .linkbtn, nav.spine, .totop { display: none !important; }
    /* Keep only the risk class from the filter bar on paper. */
    .filters { position: static; box-shadow: none; border: 0; }
    .filters .frow:not(.setrow), .setrow > :not(.clsfield) { display: none !important; }
    .layout { display: block; }
    body { background: #fff; }
    details.control { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="assess">
      <label>System being assessed<input id="system" type="text" placeholder="e.g. HR leave agent" autocomplete="off"></label>
      <button type="button" class="btn-ghost" id="export">Save to file</button>
      <button type="button" class="btn-ghost" id="import">Open file</button>
      <button type="button" class="btn-ghost" id="print">Print</button>
      <button type="button" class="btn-ghost" id="reset">Start new</button>
      <button type="button" class="btn-ghost btn-theme" id="theme"></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<div class="filters">
  <div class="wrap">
    <!-- Row 1: the assessment's settings, kept in view while scrolling. -->
    <div class="frow setrow">
      <div class="clsfield"><span id="clsLabel">Risk class</span><div class="seg" id="cls" role="group" aria-labelledby="clsLabel"></div></div>
      <button type="button" class="btn" id="profileJump" title="Go to the system profile questions"></button>
      <details class="menu wide-menu" id="sourcingMenu"><summary></summary><div class="panel wide" id="sourcingPanel"></div></details>
      <span class="spacer"></span>
      <button type="button" class="btn" id="csv">Download CSV</button>
      <button type="button" class="btn" id="vendorQ" title="Download the measures owned by, shared with or to confirm with the vendor, as a questionnaire">Vendor questionnaire</button>
    </div>
    <!-- Row 2: filters for the list. -->
    <div class="frow">
    <input type="search" class="field" id="q" placeholder="Search the checklist" aria-label="Search">
    <div class="lvl-toggle" id="levels" role="group" aria-label="Levels"></div>
    <select class="field" id="ownerFilter" aria-label="Owner">
      <option value="">Any owner</option>
      <option value="unset">Owner not set</option>
      <option value="Organisation">Organisation does it</option>
      <option value="Vendor">Vendor does it</option>
      <option value="Shared">Shared with vendor</option>
      <option value="To confirm">To confirm with vendor</option>
      <option value="Gap">Gap: nobody covers it</option>
    </select>
    <div class="seg" id="showSeg" role="group" aria-label="Show">
      <button type="button" data-show="" aria-pressed="true">All</button>
      <button type="button" data-show="todo" aria-pressed="false">To do</button>
      <button type="button" data-show="done" aria-pressed="false">Done</button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="btn" id="expand">Expand all</button>
    <button type="button" class="btn" id="collapse">Collapse all</button>
    </div>
  </div>
</div>

<div class="wrap layout">
  <nav class="spine" aria-label="Lifecycle stages">
    <div id="flagInd"></div>
    <ol id="spine"></ol>
    <div class="overall" id="overall"></div>
  </nav>
  <main>
    <details class="about">
      <summary>How to use this checklist</summary>
      <div class="about-grid" id="about"></div>
    </details>
    <details class="setup" id="profileSection" open>
      <summary><span>Step 1: Describe the system</span><span class="sprog" id="profileProgress"></span></summary>
      <div id="profilePanel"></div>
    </details>
    <div id="riskFlags"></div>
    <div id="list"></div>
  </main>
</div>
<button type="button" class="totop" id="toTop" aria-label="Back to top" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M5 9.5L10 4.5l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to top</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="fw-data">{"framework":{"title":"Agentic AI Security Control Framework","version":"0.7-draft","as_of":"2026-10-28","author":"joshua_tan@csa.gov.sg","primary_source":"Cyber Security Agency of Singapore, Securing Agentic AI: An Addendum to the Guidelines and Companion Guide on Securing AI Systems, v1.0, June 2026 (Chapter 4.3)","incorporated_source":"Cyber Security Agency of Singapore, Companion Guide on Securing AI Systems (Section 2.2). 50 of its 51 measures are covered here; see companion_guide below.","scope":{"in_scope":"Systems where a model plans or acts through tools, memory, protocols or other agents (autonomy levels 1-3, Addendum Table 4). Includes in-house builds, open-source agents, SaaS agentic products and agent features in enterprise software.","out_of_scope":"Single inference calls with no tools (autonomy level 0); these stay under the Companion Guide on Securing AI Systems.","self_contained":"This framework incorporates the Companion Guide on Securing AI Systems, so teams building or buying agentic systems need only this checklist. Teams that train or fine-tune models should also use the Companion Guide for model-hardening techniques such as adversarial training."},"id_convention":"Control IDs follow the Addendum's numbering; measures are numbered within each control (2.6.3 = third measure under Control 2.6). Controls 1.2, 3.5 and 5.1 are added from the Companion Guide and do not exist in the Addendum. `was` lists the v0.2 measure IDs that each measure replaces (v0.2 is kept as agentic-ai-control-framework-v0.2.yaml).","source_convention":"No `source` = Addendum 4.3 tables. \"4.1\" / \"4.2\" = Addendum section. \"CG\" = added from the Companion Guide. \"Framework\" = added in this framework, found in neither source document (shown as extending the Companion Guide measure in `cg_ref`). For merged measures, `source` is the origin of the main measure merged. `cg_ref` lists the Companion Guide measures that a measure covers (whether it was added from the Guide or already duplicated it)."},"merge_rule":"Parts of a measure are split into separate measures when they differ in level, scope (`when`) or owner. Otherwise they stay one measure, and its parts are listed as `checks` that are assessed individually. A measure is met when all of its checks are met.","reference_convention":"References come from the Addendum's chapter 4.3 \"Reference / Resource\" column, with its hyperlinks, attached to the measure they support or to the control where they are general. Named tools and services are examples to start from, not endorsements; check that any tool suits your environment.","owner_convention":"Each measure names the `layer` of the system it acts on (see `layers`). Each assessment records who provides each layer - Organisation, Vendor or Shared - usually by picking a sourcing preset and adjusting it, and a measure's default owner is the provider of its layer. A measure that spans two layers with different providers defaults to Shared. Usage and governance, and Data and knowledge, are always the organisation's. The default is a starting point: what a vendor covers depends on its product, tier and contract, so each assessment can change the owner of any measure, including \"To confirm\" until the vendor answers and \"Gap\" where neither party covers it. A gap needs a compensating control or formal risk acceptance (1.1.3). For Vendor rows the organisation obtains and reviews the vendor's evidence; for Shared rows each party does its part (for example, the vendor provides a feature and the organisation configures it). Accountability stays with the organisation whoever does the work. `evidence` names what an assessor should see to accept a measure as met.","revision_notes":[{"version":"0.7-draft","summary":"Replaced the Components, Capabilities and Implementation tick-boxes with a system profile (`profile`) of yes/no questions, each labelled with the Addendum taxonomy element it covers. Answering No removes the measures a question triggers; Yes or Not sure keeps them, so the checklist only shrinks when someone actively rules something out. Measures tied only to features every agent has (LLM, instructions, tools, roles and access) now apply to all systems. `applies_to` is replaced by `when` (the questions or conditions that trigger a measure) and `arc` (the Addendum taxonomy tags, kept as reference and renamed to match the Addendum's Figure 1; 4.2.4 now carries the Addendum's own Code execution tag). Replaced the per-measure `default_owner` judgements with `layer`, `layers` and `sourcing_presets`, based on Microsoft's AI agent shared responsibility model (which the Addendum cites as Figure 10), with the agent layers split into what the customer configures and what runs it, as that model's responsibility matrix does. v0.6 is kept as agentic-ai-control-framework-v0.6.yaml. Added `risk_flags` with the lethal trifecta, and two profile questions it needs (Sensitive data, Untrusted content); Untrusted content also triggers 2.9.8, 4.1.2 and 4.1.8. Controls now list the threats they address from the combined OWASP agentic threat taxonomy (`threat_taxonomy`, 20 threats on 8 surfaces), mapped by judgement from each control's measures; the Addendum's T1-T15 mapping is kept as `addendum_threats`. Control `owners` renamed `responsible_parties` (the Addendum's term) and no longer shown in the checklist. Controls 1.2, 3.5 and 5.1 drop \"(from Companion Guide x.x)\" from their titles; the reference is kept in `from_companion_guide`. Added `references` to 73 measures and controls: 179 entries from the Addendum's 4.3 \"Reference / Resource\" column, with their hyperlinks taken from the PDF (see reference_convention). Links checked 28 Oct 2026: two dead links replaced (MITRE ATLAS now links to its home page; the PDPC advisory guidelines link to their published PDF). Added 29 Companion Guide references to 14 measures, mapped by content because the Guide's reference cells are merged per control; redirected links use their current address, private SharePoint links were replaced with the tools' public repositories, and duplicates were skipped."},{"version":"0.6-draft","summary":"Renamed `owner` to `default_owner`, since the actual split varies by vendor offering. The checklist now records the actual owner per measure for each assessment, with \"To confirm\" and \"Gap\" options. Owners start unset until an implementation type is ticked; mixed types with different defaults default to Shared. Removed the \"Autonomy level 2-3\" system design tag, which is not in the Addendum's taxonomy; 1.1.4 (taint tracing) now applies to Workflows & autonomy and states the Addendum's emphasis on levels 2 and 3 in its text."},{"version":"0.5-draft","summary":"Added `evidence` to every measure and `owner` for Buy (SaaS) and Integrate. For SaaS, 67 measures are vendor-owned, 45 shared and 27 organisation-owned; for Integrate, 132 are organisation-owned and 7 shared. Owner assignments are the drafter's judgement and need review."},{"version":"0.4-draft","summary":"Applied the merge rule. Eleven items that v0.3 had merged into higher-level measures were split back out at their original levels (annual threat-model review, vendor shared responsibility, model hash verification, benchmark-based model selection, zero trust principles, segmentation review, session rate limits, database query analysis, incident-plan updates, API data validation, user-supplied code scanning) and three were split for scope (memory-store access, model version pinning, instruction validation). Compound measures gained `checks`. Result: 139 measures, 49 of them with checks (135 checks in total)."},{"version":"0.3-draft","summary":"Consolidated 184 measures into 125 by merging duplicates and near-duplicates, and moved measures to the control they fit best (network controls into 2.9, tool-call controls into 3.3, agent-to-agent controls into 3.4, the agent kill-switch into 3.5, user training into 1.2). Some merges raised lower-level items to L0 or L1; v0.4 reversed them.","removed":[{"id":"3.1.7","measure":"Tune short- and long-term memory settings to limit context growth","reason":"Performance tuning rather than a security control; runaway context is already capped by 3.1.2."}]}],"levels":{"L0":{"name":"Fundamental","meaning":"Minimum hygiene without which an agent should not run in production.","application":"Mandatory for every in-scope system before go-live.","traits":"Low cost, mature tooling. Directly limits rogue actions or sensitive data disclosure, or keeps incidents traceable and recoverable."},"L1":{"name":"Standard","meaning":"Controls that need design effort and must be adapted meaningfully to the system.","application":"Mandatory for Moderate and High risk systems, tailored to the architecture; tailoring is recorded.","traits":"Needs engineering or process work; value grows with autonomy, number of agents and integrations."},"L2":{"name":"Best practice","meaning":"Advanced or emerging measures for defence in depth.","application":"Assessed for every High risk system; good to consider elsewhere.","traits":"Higher cost, emerging techniques, or value mainly at autonomy level 3 or with high-impact capabilities."}},"tiering_criteria":["Enforced outside the model ranks higher than measures that rely on the model behaving.","Widely available tooling ranks lower; research-stage techniques sit at L2.","Recoverability (logging, backups, ability to suspend an agent) is L0.","Blast radius is expressed through `when` conditions rather than a lower level."],"applicability_rules":{"capability_conditional":"A measure whose `when` names profile questions applies unless every one of them is answered No. \"All\" means every in-scope system.","saas":"Where a measure sits with the vendor, meet it through contract or SLA terms, vendor attestation or independent testing (Addendum 4.1). Record which party owns each measure.","unclassified_default":"High"},"risk_cl   const data = JSON.parse(document.getElementById('fw-data').textContent);

  const profile = data.profile || {};
  const QUESTIONS = {};
  const QCAT = {};  // question id -> category number (profile group order), for tag colours

  const CONDITIONS = profile.conditions || {};
  const LAYERS = data.layers || [];
  const layerById = Object.fromEntries(LAYERS.map(l => [l.id, l]));
  const PRESETS = data.sourcing_presets || [];

  const all = [];
