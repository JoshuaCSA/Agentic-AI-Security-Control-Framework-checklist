  const stages = [];
  data.controls.forEach(c => { if (!stages.includes(c.stage)) stages.push(c.stage); });

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  // YAML prose marks field names with backticks for editors; drop them for readers.
  const prose = s => esc(String(s == null ? '' : s).replace(/`/g, ''));
  // References: {title, url?} or a group {title, items: [{title, url?}]}. Links open in a new tab.
  const refLink = r => r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${hl(r.title)}</a>` : hl(r.title);
  const refItem = r => r.items ? `<span class="rgroup">${hl(r.title)}: ${r.items.map(refLink).join(', ')}</span>` : `<span>${refLink(r)}</span>`;
  const refsBox = (refs, label) => refs && refs.length
    ? `<div class="refs"><span class="mcap">${label}</span>${refs.map(refItem).join('')}</div>` : '';
  const refText = refs => (refs || []).map(r => r.items ? r.title + ': ' + r.items.map(i => i.title + (i.url ? ' (' + i.url + ')' : '')).join(', ')
    : r.title + (r.url ? ' (' + r.url + ')' : '')).join('; ');

  // ---------- Assessment state (saved in this browser; export/import to move it) ----------
  const STORE = 'agentic-ai-checklist';
  // profile: question id -> 'Yes' | 'No' (absent = not sure). preset + layers: who provides each layer.
  const blank = () => ({ framework: fw.version, system: '', cls: '', profile: {}, preset: '', layers: {}, status: {}, na: {}, notes: {}, owners: {}, updated: null });
  let A = blank();
  try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.status) A = Object.assign(blank(), s); } catch (e) { /* storage unavailable */ }
  const save = () => { A.updated = new Date().toISOString(); try { localStorage.setItem(STORE, JSON.stringify(A)); } catch (e) { /* ignore */ } };

  // Filters (not saved)
  const F = { q: '', levels: new Set(LEVELS), show: '', owner: '' };

  // Who implements a measure: the provider of its layer, from the sourcing preset or a per-layer change.
  // A measure spanning layers with different providers defaults to Shared; any unset layer means no default.
  const presetOf = () => PRESETS.find(p => p.id === A.preset);
  const presetLayer = id => (presetOf() || { layers: {} }).layers[id] || '';
  const layerOwner = id => layerById[id].fixed || A.layers[id] || presetLayer(id);
  const typicalOwner = m => {
    const os = m.layer.map(layerOwner);
    if (os.includes('')) return '';
    return new Set(os).size === 1 ? os[0] : 'Shared';
  };
  const ownerOf = m => A.owners[m.id] || typicalOwner(m);
  const layerNames = m => m.layer.map(l => layerById[l].name).join(' + ');

  // A measure applies unless every trigger in its `when` is ruled out. Unanswered or unset counts as applying.
  const adjustable = LAYERS.filter(l => !l.fixed);
  const CONDITION_TEST = {
    uses_vendor: () => adjustable.some(l => ['', 'Vendor', 'Shared'].includes(layerOwner(l.id))),
    self_hosted_model: () => ['', 'Organisation', 'Shared'].includes(layerOwner('model')),
  };
  const triggerOn = t => t === 'All' || (QUESTIONS[t] ? A.profile[t] !== 'No' : CONDITION_TEST[t] ? CONDITION_TEST[t]() : true);
  const OWNERS = ['Organisation', 'Vendor', 'Shared', 'To confirm', 'Gap'];
  const OWNER_TEXT = { '': 'Select owner', Organisation: 'Organisation does it', Vendor: 'Vendor does it', Shared: 'Shared with vendor',
    'To confirm': 'To confirm with vendor', Gap: 'Gap: nobody covers it' };
  const OWNER_HINT = { '': 'Choose who implements this measure, or set how the system is sourced to fill in defaults.',
    Organisation: 'Your organisation implements this measure.',
    Vendor: 'The vendor implements this. Mark it met once you have accepted the vendor\'s evidence.',
    Shared: 'The vendor provides part of this and your organisation does the rest, for example configuring a vendor feature.',
    'To confirm': 'Waiting for the vendor to say whether, and how far, its service covers this.',
    Gap: 'Neither the vendor nor your organisation covers this. Add a compensating control or record formal risk acceptance (1.1.3).' };

  const itemKeys = m => m.checks ? m.checks.map((_, i) => `c:${m.id}:${i}`) : [`m:${m.id}`];
  function measureState(m) {
    if (A.na[m.id]) return { s: 'na', done: 0, total: 0 };
    const keys = itemKeys(m);
    const counted = keys.filter(k => A.status[k] !== 'na');
    const done = counted.filter(k => A.status[k] === 'done').length;
    if (!counted.length) return { s: 'na', done: 0, total: 0 };
    return { s: done === counted.length ? 'met' : done ? 'partial' : 'open', done, total: counted.length };
  }
  const requirement = level => A.cls ? ((data.risk_classes[A.cls] || {}).requirements || {})[level] || '' : '';
  const isMandatory = m => /^mandatory/i.test(requirement(m.level));
  const sourceLabel = m => !m.source ? 'Addendum §4.3' : m.source === 'CG' ? 'Added from Companion Guide'
    : m.source === 'Framework' ? 'Added in this framework' + ((m.cg_ref || []).length ? ' (extends CG ' + m.cg_ref.join(', ') + ')' : '') : 'Addendum §' + m.source;

  const applies = m => m.when.some(triggerOn);
  function matches(m) {
    if (!F.levels.has(m.level) || !applies(m)) return false;
    if (F.owner && ownerOf(m) !== (F.owner === 'unset' ? '' : F.owner)) return false;
    if (F.show) {
      const s = measureState(m).s;
      if (F.show === 'todo' && (s === 'met' || s === 'na')) return false;
      if (F.show === 'done' && !(s === 'met' || s === 'na')) return false;
    }
    if (F.q) {
      const hay = [m.id, m.measure, (m.checks || []).join(' '), m.control.title, m.control.id, m.when.map(triggerLabel).join(' '),
        layerNames(m),
        (m.control.threats || []).map(t => t + ' ' + ((THREATS[t] || {}).name || '')).join(' '), sourceLabel(m), (m.cg_ref || []).map(r => 'CG ' + r).join(' '),
        A.notes[m.id] || '', m.evidence || '', refText(m.references)].join(' ').toLowerCase();
      if (!hay.includes(F.q.toLowerCase())) return false;
    }
    return true;
  }
  const hl = s => {
    const t = esc(s);
    if (!F.q) return t;
    const q = esc(F.q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp(q, 'ig'), x => '<mark>' + x + '</mark>');
  };

  // ---------- Header and controls ----------
  $('title').textContent = (fw.title || 'Control framework') + ' checklist';
  $('sub').textContent = `Version ${fw.version || ''}, as of ${fw.as_of || ''}. ${all.length} measures in ${data.controls.length} controls.`;
  // Risk class: Not set, then classes from lowest to highest (the YAML lists them highest first).
  $('cls').innerHTML = [['', 'Not set']].concat(CLASSES.slice().reverse().map(c => [c, c]))
    .map(([v, t]) => `<button type="button" data-cls="${esc(v)}" aria-pressed="false">${esc(t)}</button>`).join('');
  const syncCls = () => $('cls').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cls === (A.cls || ''))));
  $('system').value = A.system;
  $('system').addEventListener('input', e => { A.system = e.target.value; save(); });
  $('cls').addEventListener('click', e => {
    const b = e.target.closest('button[data-cls]'); if (!b) return;
    A.cls = b.dataset.cls; save(); render();
  });

  $('levels').innerHTML = LEVELS.map(l => `<button type="button" class="${l}" data-level="${l}" aria-pressed="true" title="${esc(data.levels[l].meaning)}"><span class="badge ${l}">${l}</span>${esc(data.levels[l].name)}</button>`).join('');
  $('levels').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const l = b.dataset.level, on = b.getAttribute('aria-pressed') === 'true';
    if (on && F.levels.size === 1) return;
    on ? F.levels.delete(l) : F.levels.add(l);
    b.setAttribute('aria-pressed', String(!on)); render();
  });

  // System profile: one Yes / No / Not sure answer per question. No removes the measures it triggers.
  const ANSWERS = [['Yes', 'Yes'], ['No', 'No'], ['', 'Not sure']];
  $('profilePanel').innerHTML =
    `<p>Answer these first: they decide which measures apply to this system. No removes the measures a question triggers; Yes or Not sure keeps them. Labels name the element of the Addendum's taxonomy each question covers.</p>` +
    `<div class="pgroups">` + (profile.groups || []).map((g, i) => `<div class="pgroup cat${i + 1}"><h4>${esc(g.name)}</h4>` + g.questions.map(q =>
      `<div class="qrow"><div id="q-${esc(q.id)}"><b>${esc(q.label)}:</b> ${esc(q.ask)}</div>` +
      `<div class="seg small" role="group" aria-labelledby="q-${esc(q.id)}">` +
      ANSWERS.map(([v, t]) => `<button type="button" data-q="${esc(q.id)}" data-a="${v}" aria-pressed="false">${t}</button>`).join('') + `</div></div>`).join('') + `</div>`).join('') + `</div>` +
    (profile.assumed ? `<p class="assumed">Assumed for every agent: ${esc(profile.assumed.elements.join(', '))}. ${esc(profile.assumed.note)}</p>` : '') +
    `<div class="row"><button type="button" class="btn" id="profileClear">Clear answers</button></div>`;
  // Per-browser view preferences (theme, collapsed questions); never part of the assessment.
  const UI_KEY = 'agentic-ai-checklist-ui';
  const uiGet = () => { try { return JSON.parse(localStorage.getItem(UI_KEY) || '{}') || {}; } catch (e) { return {}; } };
  const uiSet = patch => { try { localStorage.setItem(UI_KEY, JSON.stringify(Object.assign(uiGet(), patch))); } catch (e) { /* ignore */ } };
  if (uiGet().profileClosed) $('profileSection').open = false;
  $('profileSection').addEventListener('toggle', () => { syncPanels(); uiSet({ profileClosed: !$('profileSection').open }); });
  const themeLabel = () => { $('theme').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Light theme' : 'Dark theme'; };
  $('theme').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); uiSet({ theme: next }); themeLabel();
  });
  themeLabel();
  $('profileJump').addEventListener('click', () => {
    $('profileSection').open = true;
    $('profileSection').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  $('profilePanel').addEventListener('click', e => {
    if (e.target.id === 'profileClear') { A.profile = {}; save(); render(); return; }
    const b = e.target.closest('button[data-q]'); if (!b) return;
    b.dataset.a ? (A.profile[b.dataset.q] = b.dataset.a) : delete A.profile[b.dataset.q];
    save(); render();
  });

  // Sourcing: a preset fills in who provides each layer; each layer can then be changed.
  $('sourcingPanel').innerHTML =
    `<p>Choose how this system is sourced. It sets who provides each layer, and each measure's default owner follows its layer. Change any layer that differs for this vendor.</p>` +
    `<div class="presets">${PRESETS.map(p => `<button type="button" class="preset" data-preset="${esc(p.id)}" aria-pressed="false"><b>${esc(p.name)}</b>${esc(p.description)}</button>`).join('')}</div>` +
    `<h4>Who provides each layer</h4>` +
    LAYERS.map(l => `<div class="lrow"><div><div class="lname"><span class="lchip ly-${esc(l.id)}">${esc(l.name)}</span></div><div class="lcovers">${esc(l.covers)}</div></div>` +
      (l.fixed ? `<div class="fixed">Always your organisation</div>`
        : `<select data-layer="${esc(l.id)}" aria-label="Who provides ${esc(l.name)}"><option value="">Not set</option>` +
          ['Organisation', 'Vendor', 'Shared'].map(o => `<option value="${o}">${o === 'Shared' ? 'Shared with vendor' : o}</option>`).join('') + `</select>` +
          `<div class="lchg" data-chg="${esc(l.id)}"></div>`) +
      `</div>`).join('') +
    `<p class="assumed">Layers are adapted from Microsoft's AI agent shared responsibility model, which the Addendum cites (Figure 10). Choosing a preset clears layer changes; owners you set on individual measures are kept.</p>` +
    `<div class="row"><button type="button" class="btn" id="sourcingClear">Clear sourcing</button></div>`;
  $('sourcingPanel').addEventListener('click', e => {
    if (e.target.id === 'sourcingClear') { A.preset = ''; A.layers = {}; save(); render(); return; }
    const b = e.target.closest('button[data-preset]'); if (!b) return;
    A.preset = A.preset === b.dataset.preset ? '' : b.dataset.preset; A.layers = {};
    save(); render();
  });
  $('sourcingPanel').addEventListener('change', e => {
    const id = e.target.dataset.layer; if (!id) return;
    const v = e.target.value;
    v === presetLayer(id) ? delete A.layers[id] : (A.layers[id] = v);
    save(); render();
  });

  // Risk flags: a leg is met when any of its questions is Yes, ruled out when all are No, possible otherwise.
  // Overall: out if any leg is ruled out; met if all legs are met; possible if some are; unknown if none are yet.
  // A flag only suggests a risk class.
  function flagState(f) {
    const legs = f.legs.map(leg => {
      const yes = leg.any.filter(q => A.profile[q] === 'Yes'), open = leg.any.filter(q => !A.profile[q]);
      return { leg, yes, open, state: yes.length ? 'met' : open.length ? 'possible' : 'out' };
    });
    const state = legs.some(l => l.state === 'out') ? 'out' : legs.every(l => l.state === 'met') ? 'met'
      : legs.some(l => l.state === 'met') ? 'possible' : 'unknown';
    return { legs, state };
  }
  const FLAG_STATE = { met: 'Meets', possible: 'May meet', out: 'Not met', unknown: 'Not assessed' };
  const LEG_STATE = { met: 'Yes', possible: 'Not sure', out: 'No' };
  function renderFlags() {
    const labels = qs => qs.map(q => QUESTIONS[q].label).join(', ');
    const flags = (data.risk_flags || []).map(f => Object.assign({ f }, flagState(f)));
    const html = flags.map(({ f, legs, state }) => {
      const head = {
        met: `${f.name}: this system meets all three conditions`,
        possible: `${f.name}: this system may meet all three conditions`,
        out: `${f.name}: not met`,
        unknown: `${f.name}: not assessed yet`,
      }[state];
      // Before anything is met or ruled out, show open conditions in grey rather than amber.
      const cls = l => state === 'unknown' ? 'unknown' : l.state;
      const rows = legs.map(l => `<li><span class="st ${cls(l)}">${LEG_STATE[l.state]}</span><span><b>${esc(l.leg.name)}:</b> ` +
        (l.state === 'met' ? `from ${esc(labels(l.yes))}` : l.state === 'out' ? `ruled out, as ${esc(labels(l.leg.any))} ${l.leg.any.length > 1 ? 'are all' : 'is'} No`
          : `answer ${esc(labels(l.open))} to check`) + `</span></li>`).join('');
      const lead = state === 'out' ? 'At least one condition is ruled out, so this attack path is closed. Re-check if the system changes.'
        : state === 'unknown' ? 'Answer the system profile questions above to check this system.'
        : `${f.explanation} The framework treats this as ${f.suggests} risk.`;
      const act = state !== 'met' && state !== 'possible' ? ''
        : A.cls === f.suggests ? `<div class="act"><span>Risk class is set to ${esc(f.suggests)}.</span></div>`
        : `<div class="act"><button type="button" class="btn" data-set-cls="${esc(f.suggests)}">Set risk class to ${esc(f.suggests)}</button>` +
          `<span>${A.cls ? `Currently ${esc(A.cls)}.` : 'No risk class set yet.'}</span></div>`;
      return `<div class="rflag ${state}" id="flag-${esc(f.id)}"><h3>${esc(head)}</h3><ul>${rows}</ul><p>${esc(lead)}</p>${act}</div>`;
    }).join('');
    $('riskFlags').innerHTML = html;
    // Compact indicator at the top of the left panel; it links to the full panel.
    $('flagInd').innerHTML = flags.map(({ f, legs, state }) =>
      `<a class="find ${state}" href="#flag-${esc(f.id)}" title="Show the ${esc(f.name)} check"><div class="fhead"><span>${esc(f.name)}</span>` +
      `<span class="fstate st ${state}">${FLAG_STATE[state]}</span></div><ul>` +
      legs.map(l => `<li><span class="dot ${state === 'unknown' ? 'unknown' : l.state}"></span>${esc(l.leg.name)}: ${LEG_STATE[l.state]}</li>`).join('') + `</ul></a>`).join('');
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-set-cls]'); if (!b) return;
    A.cls = b.dataset.setCls; save(); render();
  });

  // Keep both panels in step with the assessment without rebuilding them, so focus is not lost.
  function syncPanels() {
    const answered = Object.keys(A.profile).filter(k => QUESTIONS[k]).length;
    const total = Object.keys(QUESTIONS).length;
    $('profileJump').textContent = `System profile (${answered} of ${total} answered)`;
    $('profileProgress').textContent = `${answered} of ${total} answered` + ($('profileSection').open ? '' : '. Show questions');
    document.querySelectorAll('#profilePanel button[data-q]').forEach(b =>
      b.setAttribute('aria-pressed', String((A.profile[b.dataset.q] || '') === b.dataset.a)));
    const p = presetOf(), changed = Object.keys(A.layers).length > 0;
    const ss = $('sourcingMenu').querySelector('summary');
    ss.textContent = 'Sourcing: ' + (p ? p.name + (changed ? ' (changed)' : '') : changed ? 'custom' : 'not set');
    ss.classList.toggle('active', !!p || changed);
    document.querySelectorAll('#sourcingPanel button[data-preset]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === A.preset)));
    document.querySelectorAll('#sourcingPanel select[data-layer]').forEach(s => { s.value = layerOwner(s.dataset.layer); });
    document.querySelectorAll('#sourcingPanel [data-chg]').forEach(d => {
      const id = d.dataset.chg;
      d.textContent = p && A.layers[id] != null ? `Changed from preset (${presetLayer(id) === 'Shared' ? 'Shared with vendor' : presetLayer(id)})` : '';
    });
  }
  document.addEventListener('click', e => document.querySelectorAll('details.menu').forEach(d => { if (!d.contains(e.target)) d.open = false; }));

  $('ownerFilter').addEventListener('change', e => { F.owner = e.target.value; render(); });
  $('overall').addEventListener('click', e => {
    const b = e.target.closest('[data-owner-filter]'); if (!b) return;
    F.owner = F.owner === b.dataset.ownerFilter ? '' : b.dataset.ownerFilter;
    $('ownerFilter').value = F.owner; render();
  });
  // Track the sticky filter bar's height so the left panel and anchor jumps sit just below it.
  const setFh = () => document.documentElement.style.setProperty('--fh', document.querySelector('.filters').offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(setFh).observe(document.querySelector('.filters')); else setFh();
  let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value.trim(); render(); }, 120); });
  $('showSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    F.show = b.dataset.show;
    $('showSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  $('expand').addEventListener('click', () => document.querySelectorAll('details.control').forEach(d => { d.open = true; }));
  $('collapse').addEventListener('click', () => document.querySelectorAll('details.control').forEach(d => { d.open = false; }));
  $('print').addEventListener('click', () => window.print());
  window.addEventListener('beforeprint', () => document.querySelectorAll('details.control').forEach(d => { d.open = true; }));

  // ---------- About ----------
  (function about() {
    const rules = data.applicability_rules || {};
    const levelHtml = LEVELS.map(l => `<p><span class="badge ${l}">${l} ${esc(data.levels[l].name)}</span> ${esc(data.levels[l].meaning)} ${esc(data.levels[l].application)}</p>`).join('');
    const classHtml = CLASSES.map(c => {
      const rc = data.risk_classes[c];
      return `<h3>${esc(c)} risk</h3><ul>${(rc.triggers || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` +
        `<p class="cmeta">${Object.entries(rc.requirements || {}).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join('<br>')}</p>`;
    }).join('');
    const cg = data.companion_guide || {};
    const cgCovered = new Set(all.flatMap(m => m.cg_ref || [])).size;
    $('about').innerHTML =
      `<div><h3>Steps</h3><ol><li>Describe the system: name it in the header, then answer the questions in Step 1 below. Answering No removes the measures a question triggers; anything unanswered stays in.</li>` +
      `<li>Under Sourcing, choose how the system is sourced, and change any layer this vendor handles differently. Each measure's default owner follows its layer.</li>` +
      `<li>Choose the risk class. The lethal trifecta check below Step 1 suggests one when it applies.</li>` +
      `<li>Work through each measure. Tick its checks, or the box beside it when it has none. Mark anything that does not apply as not applicable, and add notes as evidence.</li>` +
      `<li>Change a measure's owner where it differs from its layer: set "To confirm" until the vendor answers, and "Gap" where nobody covers it. Use Vendor questionnaire to request evidence, and mark measures met once you accept it.</li>` +
      `<li>Use Save to file to keep or share the assessment. Progress is also kept in this browser.</li></ol>` +
      `<p>${prose(data.owner_convention)}</p><p>${prose(data.reference_convention)}</p>` +
      `<h3>Levels</h3>${levelHtml}<p>${prose(rules.capability_conditional)}</p><p>${prose(rules.saas)}</p></div>` +
      `<div><h3>Risk classes</h3><p>The highest class whose trigger applies wins. An unclassified system is treated as ${esc(rules.unclassified_default || 'High')}.</p>${classHtml}</div>` +
      `<div><h3>Scope</h3><p>${esc((fw.scope || {}).in_scope)}</p><p>${esc((fw.scope || {}).self_contained)}</p>` +
      (cg.measures_total ? `<p class="cmeta">Companion Guide coverage: ${cgCovered} of ${esc(cg.measures_total)} measures. Not incorporated: ${(cg.not_incorporated || []).map(x => `${esc(x.id)} (${esc(x.reason)})`).join('; ')}</p>` : '') + `</div>`;
  })();

  // ---------- Rendering ----------
  const tick = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const dash = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const openNotes = new Set();

  function statusBox(m, st) {
    const label = { met: 'Met', partial: `${st.done} of ${st.total} checks met`, open: 'Not met', na: 'Not applicable' }[st.s];
    const inner = st.s === 'met' ? tick : st.s === 'na' ? dash : st.s === 'partial' ? `<span>${st.done}/${st.total}</span>` : '';
    const fill = st.s === 'partial' ? ` style="--fill:${Math.round(st.done / st.total * 100)}%"` : '';
    return `<button type="button" class="status ${st.s}" data-act="toggle" data-id="${esc(m.id)}"${fill} aria-label="${esc(m.id)}: ${label}. Toggle met." title="${label}">${inner}</button>`;
  }

  function measureHtml(m) {
    const st = measureState(m);
    const req = requirement(m.level);
    const refs = [`<span class="ref">${esc(sourceLabel(m))}</span>`];
    if (m.cg_ref && m.cg_ref.length && m.source !== 'Framework') refs.push(`<span class="ref">${hl('CG ' + m.cg_ref.join(', '))}</span>`);
    const checks = m.checks ? `<ul class="checks">` + m.checks.map((c, i) => {
      const k = `c:${m.id}:${i}`, v = A.status[k], dis = A.na[m.id] ? ' disabled' : '';
      return `<li class="${v === 'na' ? 'na' : ''}"><input type="checkbox" id="${esc(k)}" data-key="${esc(k)}"${v === 'done' ? ' checked' : ''}${v === 'na' || dis ? ' disabled' : ''}>` +
        `<label for="${esc(k)}">${hl(c)}</label><button type="button" class="linkbtn" data-act="check-na" data-key="${esc(k)}"${dis}>${v === 'na' ? 'Applies' : 'Not applicable'}</button></li>`;
    }).join('') + `</ul>` : '';
    const note = A.notes[m.id] || '';
    const noteUi = openNotes.has(m.id)
      ? `<textarea class="note" data-note="${esc(m.id)}" placeholder="Evidence, owner, or why it does not apply">${esc(note)}</textarea>`
      : (note ? `<div class="note-preview">${hl(note)}</div>` : '');
    return `<li class="measure is-${st.s}" data-mid="${esc(m.id)}">${statusBox(m, st)}<div>` +
      `<div class="mtext"><span class="mid">${hl(m.id)}</span>${hl(m.measure)}</div>${checks}` +
      (m.evidence ? `<div class="evidence"><b>Evidence:</b> ${hl(m.evidence)}</div>` : '') +
      refsBox(m.references, m.references && m.references.length > 1 ? 'References' : 'Reference') +
      (() => {
        // Profile tags name capabilities ("For systems with: Code execution"); Sourcing tags read as conditions ("Applies when: Uses a vendor").
        const tag = t => {
          const q = QUESTIONS[t], c = CONDITIONS[t];
          const tip = q ? 'Profile question: ' + q.ask : c ? 'Set by your Sourcing choice. ' + c.rule : '';
          const yes = q && A.profile[t] === 'Yes';
          return `<span class="tag trigger cat${QCAT[t] || 0}${yes ? ' hit' : ''}" title="${esc(tip + (yes ? ' (answered Yes)' : ''))}">${hl(triggerLabel(t))}</span>`;
        };
        const prof = m.when.filter(t => QUESTIONS[t]), cond = m.when.filter(t => t !== 'All' && !QUESTIONS[t]);
        const group = (cap, ts) => ts.length ? `<span class="mcap">${cap}</span>` + ts.map(tag).join('') : '';
        const html = group('For systems with:', prof) + group('Applies when:', cond);
        return html ? `<div class="meta">${html}</div>` : '';
      })() +
      // Source references sit quietly at the end of the action row.
      `<div class="actions"><button type="button" class="linkbtn" data-act="na" data-id="${esc(m.id)}">${A.na[m.id] ? 'Mark as applicable' : 'Not applicable'}</button>` +
      `<button type="button" class="linkbtn" data-act="note" data-id="${esc(m.id)}">${openNotes.has(m.id) ? 'Done with note' : note ? 'Edit note' : 'Add note'}</button>` +
      `<span class="srcs" title="Where this measure comes from">${refs.join('')}</span></div>${noteUi}</div>` +
      // Right column: the level with what the risk class requires of it, then who does it (layer and owner).
      `<div class="mright"><div class="mlevel"><span class="badge ${m.level}" title="${esc(data.levels[m.level].meaning)}">${m.level} ${esc(data.levels[m.level].name)}</span>` +
      (req ? `<span class="req${/^mandatory/i.test(req) ? ' mandatory' : ''}" title="What a ${esc(A.cls)} risk system must do with ${m.level} measures">${esc(A.cls)} risk: ${esc(req)}</span>`
        : `<span class="req unset" title="Choose a risk class in the bar above to see what this level requires">Risk class not yet selected</span>`) + `</div>` +
      (() => {
        const o = ownerOf(m), typ = typicalOwner(m), changed = !!A.owners[m.id] && A.owners[m.id] !== typ;
        const opts = (typ ? OWNERS : [''].concat(OWNERS)).map(x =>
          `<option value="${x}"${x === o ? ' selected' : ''}>${OWNER_TEXT[x]}${typ && x === typ ? ' (default)' : ''}</option>`).join('');
        const reset = `<button type="button" class="linkbtn" data-act="owner-reset" data-id="${esc(m.id)}">${typ ? 'Reset to default' : 'Clear'}</button>`;
        const chips = `<span class="mlayer"><span class="mcap">${m.layer.length > 1 ? 'Layers:' : 'Layer:'}</span>` +
          m.layer.map(l => `<span class="lchip ly-${esc(l)}" title="${esc(layerById[l].covers)}">${hl(layerById[l].name)}</span>`).join('') + `</span>`;
        // Layer first, then the owner it sets, so the caption sits directly above the dropdown.
        return `<div class="mowner">${chips}<span class="mcap">Who does it</span>` +
          `<select class="owner ${o ? o.replace(' ', '-') : 'unset'}" data-owner="${esc(m.id)}" aria-label="Who does ${esc(m.id)}" title="${esc(OWNER_HINT[o])}">${opts}</select>` +
          `<span class="owner-note">${changed ? (typ ? 'Changed from default. ' : '') + reset : typ ? `Default for ${m.layer.length > 1 ? 'these layers' : 'this layer'}` : 'No default yet'}</span></div>`;
      })() + `</div></li>`;
  }

  function tally(ms) {
    const scoped = ms.filter(m => measureState(m).s !== 'na');
    return { met: scoped.filter(m => measureState(m).s === 'met').length, total: scoped.length };
  }
  const pct = t => t.total ? Math.round(t.met / t.total * 100) : 0;

  function controlSummary(c, ms) {
    const t = tally(ms);
    const lv = LEVELS.map(l => { const n = ms.filter(m => m.level === l).length; return n ? `<span class="badge ${l}" title="${n} ${esc(data.levels[l].name)} measure${n === 1 ? '' : 's'}">${l}: ${n}</span>` : ''; }).join('');
    // Threats this control addresses, named from the combined OWASP taxonomy; the code and description show on hover.
    const meta = (c.threats || []).length ? 'Addresses: ' + c.threats.map(t => {
      const th = THREATS[t] || { name: t };
      return `<span class="threat" title="${esc(t + ': ' + (th.description || ''))}">${esc(th.name)}</span>`;
    }).join(', ') : '';
    return `<span class="cid">${esc(c.id)}</span><span><div class="ctitle">${hl(c.title)}</div>${meta ? `<div class="cmeta">${meta}</div>` : ''}` +
      (c.note ? `<div class="cmeta cnote">${esc(c.note)}</div>` : '') + `</span>` +
      `<span class="cside"><span class="lvcount">${lv}</span><div class="frac">${t.met} of ${t.total} met</div><div class="bar"><i style="width:${pct(t)}%"></i></div></span>`;
  }

  function render() {
    syncCls();
    syncPanels();
    renderFlags();
    const open = new Set(Array.from(document.querySelectorAll('details.control[open]')).map(d => d.dataset.id));
    const first = !document.querySelector('details.control');
    const autoOpen = F.q || F.show;
    const vis = all.filter(matches);
    let html = '';
    stages.forEach((stage, si) => {
      const sv = vis.filter(m => m.control.stage === stage);
      if (!sv.length) return;
      html += `<section class="stage s${si + 1}" id="stage-${slug(stage)}"><h2><span class="snum">${si + 1}</span>${esc(stage)}<span class="count">${sv.length} measures</span></h2>`;
      data.controls.filter(c => c.stage === stage).forEach(c => {
        const ms = sv.filter(m => m.control === c);
        if (!ms.length) return;
        const isOpen = !first && (autoOpen || open.has(c.id));
        html += `<details class="control" data-id="${esc(c.id)}"${isOpen ? ' open' : ''}><summary>${controlSummary(c, ms)}</summary>${refsBox(c.references, 'References for this control')}<ul class="measures">${ms.map(measureHtml).join('')}</ul></details>`;
      });
      html += `</section>`;
    });
    $('list').innerHTML = html || `<div class="empty">No measures match these filters. Clear the search or change the filters to see more.</div>`;
    renderProgress();
  }

  // Applicable set for progress ignores search, source and show filters.
  const progressSet = () => all.filter(m => F.levels.has(m.level) && applies(m));

  function renderProgress() {
    const ps = progressSet();
    $('spine').innerHTML = stages.map((stage, i) => {
      const t = tally(ps.filter(m => m.control.stage === stage));
      return `<li class="s${i + 1}${t.total && t.met === t.total ? ' done' : ''}"><a href="#stage-${slug(stage)}"><span class="num">${i + 1}</span>` +
        `<span><div class="name">${esc(stage)}</div><div class="count">${t.met} of ${t.total} met</div><div class="bar"><i style="width:${pct(t)}%"></i></div></span></a></li>`;
    }).join('');
    const scope = A.cls ? ps.filter(isMandatory) : ps;
    const t = tally(scope);
    $('overall').innerHTML = `<div class="big">${pct(t)}%</div><div class="lbl">${A.cls ? `of mandatory measures met for a ${esc(A.cls)} risk system` : 'of applicable measures met'} (${t.met} of ${t.total})</div>` +
      LEVELS.filter(l => F.levels.has(l)).map(l => { const lt = tally(ps.filter(m => m.level === l)); return `<div class="lv"><span class="badge ${l}">${l}</span><div class="bar"><i class="${l}" style="width:${pct(lt)}%"></i></div><span>${lt.met}/${lt.total}</span></div>`; }).join('') +
      (() => {
        // Owner counts for applicable measures; clicking one filters the list to it.
        const live = ps.filter(m => !A.na[m.id]);
        const count = o => live.filter(m => ownerOf(m) === o).length;
        const rows = [['Organisation', 'Organisation does it'], ['Vendor', 'Vendor does it'], ['Shared', 'Shared with vendor'],
          ['To confirm', 'To confirm with vendor'], ['Gap', 'Gap: needs a compensating control or risk acceptance'], ['unset', 'No owner set']];
        return `<div class="flags"><h4>Who does it</h4>` + rows.map(([key, text]) => {
          const k = count(key === 'unset' ? '' : key);
          if (key === 'unset' && !k) return '';
          return `<button type="button" class="orow${k ? '' : ' zero'}" data-owner-filter="${key}" aria-pressed="${F.owner === key}"><b>${k}</b><span>${text}</span></button>`;
        }).join('') + `<div class="hint">${F.owner ? 'Click again to show all owners.' : 'Click a count to show only those measures.'}</div></div>`;
      })();
  }

  // Update one measure in place so focus and scroll position are kept.
  function refreshMeasure(id) {
    const li = document.querySelector(`li.measure[data-mid="${CSS.escape(id)}"]`);
    if (li) {
      const tmp = document.createElement('ul'); tmp.innerHTML = measureHtml(byId[id]);
      li.replaceWith(tmp.firstElementChild);
      const d = document.querySelector(`details.control[data-id="${CSS.escape(byId[id].control.id)}"]`);
      if (d) d.querySelector('summary').innerHTML = controlSummary(byId[id].control, Array.from(d.querySelectorAll('li.measure')).map(x => byId[x.dataset.mid]));
    }
    renderProgress();
  }

  $('list').addEventListener('change', e => {
    const oid = e.target.dataset.owner;
    if (oid) {
      const v = e.target.value;
      v === typicalOwner(byId[oid]) ? delete A.owners[oid] : (A.owners[oid] = v);
      save(); refreshMeasure(oid); return;
    }
    const k = e.target.dataset.key; if (!k) return;
    e.target.checked ? (A.status[k] = 'done') : delete A.status[k];
    save(); refreshMeasure(k.split(':')[1]);
  });
  $('list').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'check-na') {
      const k = b.dataset.key;
      A.status[k] === 'na' ? delete A.status[k] : (A.status[k] = 'na');
      save(); refreshMeasure(k.split(':')[1]); return;
    }
    const id = b.dataset.id, m = byId[id];
    if (act === 'toggle') {
      if (A.na[id]) return;
      const keys = itemKeys(m).filter(k => A.status[k] !== 'na');
      const allDone = keys.every(k => A.status[k] === 'done');
      keys.forEach(k => { allDone ? delete A.status[k] : (A.status[k] = 'done'); });
    } else if (act === 'owner-reset') {
      delete A.owners[id];
    } else if (act === 'na') {
      A.na[id] ? delete A.na[id] : (A.na[id] = true);
    } else if (act === 'note') {
      openNotes.has(id) ? openNotes.delete(id) : openNotes.add(id);
      refreshMeasure(id);
      const ta = document.querySelector(`textarea[data-note="${CSS.escape(id)}"]`); if (ta) ta.focus();
      return;
    }
    save(); refreshMeasure(id);
  });
  $('list').addEventListener('input', e => {
    const id = e.target.dataset.note; if (!id) return;
    const v = e.target.value.trim(); v ? (A.notes[id] = e.target.value) : delete A.notes[id];
    save();
  });

  // ---------- Save, open, reset, CSV ----------
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); };
  const download = (name, text, type) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const fileBase = () => (A.system ? slug(A.system) : 'agentic-ai') + '-assessment';

  $('export').addEventListener('click', () => { download(fileBase() + '.json', JSON.stringify(A, null, 2), 'application/json'); toast('Assessment saved to file'); });
  $('import').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const d = JSON.parse(t);
      if (!d || typeof d.status !== 'object') throw new Error('not an assessment');
      A = Object.assign(blank(), d); save();
      $('system').value = A.system;
      render();
      toast(d.framework && d.framework !== fw.version ? `Opened. It was made with version ${d.framework}, so some IDs may have changed.` : 'Assessment opened');
    }).catch(() => toast('That file is not a saved assessment')).finally(() => { e.target.value = ''; });
  });
  $('reset').addEventListener('click', () => {
    if (!confirm('Start a new assessment? Ticks, notes and system details in this browser will be cleared. Save to file first if you need them.')) return;
    A = blank(); save();
    $('system').value = '';
    render(); toast('New assessment started');
  });

  $('csv').addEventListener('click', () => {
    const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const label = { met: 'Met', partial: 'Partly met', open: 'Not met', na: 'Not applicable' };
    const head = ['System', 'Stage', 'Control', 'Control title', 'ID', 'Measure', 'Checks', 'Evidence', 'Applies when', 'Level', 'Requirement',
      'Layer', 'Default owner (from layer)', 'Owner (this assessment)', 'Status', 'Checks met', 'Note', 'Source', 'Threats addressed (control)', 'References', 'Addendum taxonomy', 'Companion Guide refs', 'Previous IDs (v0.2)'];
    const rows = all.filter(matches).map(m => {
      const st = measureState(m);
      const checks = (m.checks || []).map((c, i) => { const v = A.status[`c:${m.id}:${i}`]; return (v === 'done' ? '[x] ' : v === 'na' ? '[n/a] ' : '[ ] ') + c; }).join('\n');
      return [A.system, m.control.stage, m.control.id, m.control.title, m.id, m.measure, checks, m.evidence || '', m.when.map(triggerLabel).join('; '),
        m.level + ' ' + data.levels[m.level].name, requirement(m.level), layerNames(m), typicalOwner(m) || 'Not set', ownerOf(m) || 'Not set',
        label[st.s], m.checks ? `${st.done} of ${st.total}` : '', A.notes[m.id] || '', sourceLabel(m), (m.control.threats || []).map(t => t + ' ' + ((THREATS[t] || {}).name || '')).join('; '), refText(m.references), m.arc.join('; '), (m.cg_ref || []).join('; '), (m.was || []).join('; ')].map(cell).join(',');
    });
    download(fileBase() + '.csv', '﻿' + [head.map(cell).join(',')].concat(rows).join('\r\n'), 'text/csv');
  });

  // Vendor questionnaire: every applicable measure the vendor does or shares, phrased as a request.
  $('vendorQ').addEventListener('click', () => {
    const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const ASK = ['Vendor', 'Shared', 'To confirm'];
    const ms = all.filter(m => F.levels.has(m.level) && applies(m) && !A.na[m.id] && ASK.includes(ownerOf(m)));
    if (!ms.length) { toast('No measures are set to Vendor, Shared or To confirm yet. Set Sourcing, or set owners on measures.'); return; }
    const head = ['Ref', 'Area', 'Layer', 'Our current view', 'Request to vendor', 'Checks to address', 'Evidence requested', 'Level', 'Requirement',
      'Covered by your service? (Fully / Partly / No)', 'Vendor response', 'Evidence provided'];
    const rows = ms.map(m => {
      const o = ownerOf(m);
      const ask = o === 'Vendor' ? `Describe how your service meets this, and provide the evidence: ${m.measure}.`
        : o === 'Shared' ? `Describe the part your service provides and what we must configure ourselves: ${m.measure}.`
        : `Tell us whether your service covers this fully, partly or not at all, and provide the evidence: ${m.measure}.`;
      return [m.id, m.control.title, layerNames(m), OWNER_TEXT[o], ask, (m.checks || []).map(c => '- ' + c).join('\n'), m.evidence || '',
        m.level + ' ' + data.levels[m.level].name, requirement(m.level) || '', '', '', ''].map(cell).join(',');
    });
    download((A.system ? slug(A.system) : 'agentic-ai') + '-vendor-questionnaire.csv', '﻿' + [head.map(cell).join(',')].concat(rows).join('\r\n'), 'text/csv');
    toast(`Questionnaire with ${ms.length} items downloaded`);
  });

  // Back to top: shown once the page has scrolled past the first screen; focus returns to the top of the page.
  const toTop = $('toTop');
  const syncTop = () => { toTop.hidden = window.scrollY < window.innerHeight * 0.8; };
  window.addEventListener('scroll', syncTop, { passive: true });
  toTop.addEventListener('click', () => {
    $('system').focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  syncTop();

  render();
})();
</script>
</body>
</html>
